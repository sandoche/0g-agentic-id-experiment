name: Publish code tours

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'CNAME'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'CNAME'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and package the static tour
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate both tours and stage only public files
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import shutil
          from html.parser import HTMLParser

          class Page(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'script' and attrs.get('src'):
                      raise ValueError('The tour must not require external scripts')
                  if tag == 'link' and 'stylesheet' in attrs.get('rel', ''):
                      raise ValueError('The tour must embed its styles')

          source = pathlib.Path('index.html')
          assert source.is_file() and not source.is_symlink()
          html = source.read_text(encoding='utf-8')
          assert html.lstrip().lower().startswith('<!doctype html>')
          Page().feed(html)
          matches = re.findall(r'<script id="tour-data" type="application/json">(.*?)</script>', html, re.S)
          assert len(matches) == 1, 'Missing or duplicate tour data'
          bundle = json.loads(matches[0])
          assert set(bundle['tours']) == {'portfolio', 'probe'}
          assert bundle['defaultTour'] in bundle['tours']
          for key, tour in bundle['tours'].items():
              assert re.fullmatch(r'[0-9a-f]{40}', tour['commit'])
              assert tour['scenes'] and tour['sources']
              assert all(scene['steps'] and isinstance(scene['rows'], list) for scene in tour['scenes'])
              steps = sum(len(scene['steps']) for scene in tour['scenes'])
              print(f"{key}: {len(tour['scenes'])} scenes, {steps} focus points; source {tour['shortCommit']}")
          assert pathlib.Path('CNAME').read_text(encoding='utf-8').strip() == '0g.san.cx'
          output = pathlib.Path('_site')
          output.mkdir(exist_ok=True)
          shutil.copyfile(source, output / 'index.html')
          shutil.copyfile('CNAME', output / 'CNAME')
          (output / '.nojekyll').touch()
          assert {p.name for p in output.iterdir()} == {'index.html', 'CNAME', '.nojekyll'}
          print('Only index.html, CNAME and .nojekyll are staged. No agent code is executed.')
          PY
      - name: Upload the public site only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages settings
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
