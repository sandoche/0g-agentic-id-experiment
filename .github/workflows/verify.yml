name: Verify portfolio worker
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check formatting, lint, and imports with Biome
        run: npx --no-install biome ci .
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: npm run agent -- simulate --once --env .env.example
